pluginManagement {
    def selectedTarget = providers.gradleProperty('target').getOrElse('1.20.1')
    def targetPropertiesFile = file("versions/${selectedTarget}.properties")
    if (!targetPropertiesFile.isFile()) {
        throw new GradleException("Unknown Fabric target: ${selectedTarget}")
    }

    def targetProperties = new Properties()
    targetPropertiesFile.withInputStream { targetProperties.load(it) }

    plugins {
        id 'fabric-loom' version targetProperties.getProperty('loom_version')
        id 'net.fabricmc.fabric-loom' version targetProperties.getProperty('loom_version')
    }

    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        gradlePluginPortal()
        mavenCentral()
    }
}

def selectedTarget = providers.gradleProperty('target').getOrElse('1.20.1')
def selectedProperties = new Properties()
file("versions/${selectedTarget}.properties").withInputStream { selectedProperties.load(it) }
if (Boolean.parseBoolean(selectedProperties.getProperty('unobfuscated', 'false'))) {
    rootProject.buildFileName = 'build-unobfuscated.gradle'
}

rootProject.name = 'ftp_mod-fabric'
