pluginManagement {
    def selectedTarget = providers.gradleProperty('target').getOrElse('1.21.1')
    def targetPropertiesFile = file("versions/${selectedTarget}.properties")
    if (!targetPropertiesFile.isFile()) {
        throw new GradleException("Unknown NeoForge target: ${selectedTarget}")
    }

    def targetProperties = new Properties()
    targetPropertiesFile.withInputStream { targetProperties.load(it) }

    plugins {
        id 'net.neoforged.moddev' version targetProperties.getProperty('moddev_version')
    }

    repositories {
        gradlePluginPortal()
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
    }
}

rootProject.name = 'ftp_mod-neoforge'
